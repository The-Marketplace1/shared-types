name: CD

on:
  push:
    branches:
      - main

# Only one deployment runs at a time; new pushes cancel in-flight deployments.
concurrency:
  group: cd-production
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api-server

jobs:
  # ── 1. Build & push Docker image to GHCR ─────────────────────────────────────
  release:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: artifacts/api-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to production ───────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: release
    environment:
      name: production
      # Update this URL once your production host is known
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Option A: SSH deploy (uncomment and configure) ──────────────────────
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_SSH_KEY }}
      #     script: |
      #       docker pull ${{ needs.release.outputs.image-tag }}
      #       docker stop api-server || true
      #       docker rm   api-server || true
      #       docker run -d --name api-server \
      #         -p 8080:8080 \
      #         -e NODE_ENV=production \
      #         -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
      #         -e SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
      #         ${{ needs.release.outputs.image-tag }}

      # ── Option B: Railway (uncomment and configure) ─────────────────────────
      # - name: Deploy to Railway
      #   run: |
      #     curl -fsSL https://railway.app/install.sh | sh
      #     railway up --service api-server --detach
      #   env:
